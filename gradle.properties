# ============================================================================
#  Gradle properties - proyek Ketemu
#  Catatan: output build memakai lokasi standar (app/build). Bila proyek
#  diletakkan di folder yang di-sync cloud dan build gagal karena berkas
#  terkunci, lihat komentar "LOKASI OUTPUT BUILD (OPSIONAL)" di build.gradle.kts.
# ============================================================================

# ---- Performa & stabilitas ----
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

# Aktifkan baris di bawah HANYA bila muncul error file-watching pada folder yang
# di-sync layanan cloud (mis. "Could not watch ... file system").
# org.gradle.vfs.watch=false

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Kotlin ----
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
