# ============================================================================
#  Gradle properties - proyek Ketemu
#  Catatan: proyek berada di dalam folder OneDrive, lihat juga build.gradle.kts
#  (bagian ONEDRIVE-SAFE BUILD) dan docs/BUILD.md
# ============================================================================

# ---- Performa & stabilitas ----
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

# Aktifkan baris di bawah HANYA bila muncul error file-watching pada folder OneDrive
# org.gradle.vfs.watch=false

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Kotlin ----
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
